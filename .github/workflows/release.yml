# Build both distributables and publish a GitHub release when a v* tag is pushed.
# The tag must match package.json's version; the release fails if it already exists.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches package.json version
        run: |
          version=$(jq -r .version package.json)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Installs the pnpm version pinned by packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - run: make setup
      - run: make check
      - run: make test
      - run: make

      - name: Package release assets
        run: |
          name="loglinealign-${VERSION}"
          mkdir -p "release/${name}"
          cp -r README.md LICENSE docs dist/loglinealign.js dist/loglinealign.html "release/${name}/"
          cp dist/loglinealign.js dist/loglinealign.html release/
          cd release
          XZ_OPT=-9e tar --owner=0 --group=0 -cJf "${name}.tar.xz" "${name}"
          zip -9 -rq "${name}.zip" "${name}"
          sha256sum loglinealign.js loglinealign.html "${name}.tar.xz" "${name}.zip" > SHA256SUMS

      - name: Create release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="loglinealign-${VERSION}"
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes \
            loglinealign.js loglinealign.html "${name}.tar.xz" "${name}.zip" SHA256SUMS
